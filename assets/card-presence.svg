<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Presence Studio: Monte e controle sua Rich Presence do Discord numa interface visual, sem mexer em código.">
<title>Presence Studio: Monte e controle sua Rich Presence do Discord numa interface visual, sem mexer em código.</title>
<defs>
  <filter id="rough" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="roughS" x="-5%" y="-30%" width="110%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="roughT" x="-5%" y="-10%" width="110%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="brushF" x="-3%" y="-120%" width="106%" height="340%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.12" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.106  0 0 0 0 0.094  0 0 0 0 0.082  1.4 0 0 0 -0.62"/>
  </filter>
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.08" numOctaves="2" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.72  0 0 0 0 0.52  0 0 0 0 0.17  1.6 0 0 0 -0.85"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="#f3ebdd" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ece0c9"/>
  </radialGradient>
  <clipPath id="frame"><rect width="600" height="300" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="600" height="300" fill="#f3ebdd"/>
  <rect width="600" height="300" filter="url(#fibers)" opacity=".45"/>
  <rect width="600" height="300" fill="url(#vignette)"/>
  <text x="574" y="282" text-anchor="end" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'Noto Serif CJK JP', 'MS Mincho', serif" font-size="250" fill="#1b1815" opacity=".06">絆</text>
  <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="#1b1815" stroke-opacity=".2" stroke-width="1.3" filter="url(#rough)"/>
  <rect x="40" y="42" width="12" height="12" rx="2" fill="#8f3b34" transform="rotate(-6 46 48)"/>
  <text x="62" y="53" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#4a423a">DESKTOP · v1.1.0</text>
  <g opacity="0.55" filter="url(#brushF)"><path d="M36,106.4 C47.7,96 100.6,94.1 177,95.7 C253.3,97 306.2,98.6 329.7,104 C300.3,106.9 247.4,110.4 171.1,111.7 C106.5,112.8 50.7,113.9 36,106.4 Z" fill="#d9a441"/><path d="M241.6,100.5 L335.5,101.6" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round" opacity=".55"/><path d="M253.3,104.8 L329.7,104.2" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round" opacity=".55"/><path d="M265.1,108.5 L323.8,106.4" stroke="#d9a441" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></g>
  <text x="40" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#1b1815">Presence Studio</text>
  <text x="40" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#4a423a">Monte e controle sua Rich Presence do Discord</text>
  <text x="40" y="195" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#4a423a">numa interface visual, sem mexer em código.</text>
  <rect x="40" y="226" width="91.2" height="30" rx="15" fill="#ece0c9" stroke="#b8842c" stroke-width="1.4"/><text x="85.6" y="246" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1815">Electron</text>
  <rect x="141.2" y="226" width="107" height="30" rx="15" fill="#ece0c9" stroke="#b8842c" stroke-width="1.4"/><text x="194.7" y="246" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1815">JavaScript</text>
  <rect x="258.2" y="226" width="114.9" height="30" rx="15" fill="#ece0c9" stroke="#b8842c" stroke-width="1.4"/><text x="315.6" y="246" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b1815">Discord RPC</text>
  <text x="522" y="246" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#4a423a">REPO</text><text x="560" y="250" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b8842c">→</text>
  <rect width="600" height="300" filter="url(#grain)" opacity=".55"/>
</g>
</svg>
