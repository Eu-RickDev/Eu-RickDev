<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="作品 PROJETOS">
<title>作品 PROJETOS</title>
<defs>
  <filter id="rough" x="-10%" y="-30%" width="120%" height="160%">
